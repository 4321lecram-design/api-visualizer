<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Catalogue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
    <style>
        .carousel-container {
            position: relative;
            overflow: hidden;
            border-radius: 0.75rem;
            background: #f3f4f6;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .carousel-item {
            min-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .carousel-item img {
            max-height: 400px;
            object-fit: contain;
            transition: opacity 0.3s ease-in;
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        img {
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        img.loaded {
            opacity: 1;
        }

        .img-error {
            opacity: 1 !important;
            filter: grayscale(1);
        }

        /* Markdown content styling */
        .markdown-content {
            line-height: 1.6;
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3,
        .markdown-content h4,
        .markdown-content h5,
        .markdown-content h6 {
            font-weight: 700;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }

        .markdown-content h1 {
            font-size: 2em;
        }

        .markdown-content h2 {
            font-size: 1.5em;
        }

        .markdown-content h3 {
            font-size: 1.25em;
        }

        .markdown-content p {
            margin-bottom: 1em;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin-left: 1.5em;
            margin-bottom: 1em;
        }

        .markdown-content ul {
            list-style-type: disc;
        }

        .markdown-content ol {
            list-style-type: decimal;
        }

        .markdown-content li {
            margin-bottom: 0.5em;
        }

        .markdown-content strong {
            font-weight: 700;
        }

        .markdown-content em {
            font-style: italic;
        }

        .markdown-content code {
            background-color: #f1f5f9;
            padding: 0.2em 0.4em;
            border-radius: 0.25rem;
            font-family: monospace;
            font-size: 0.9em;
        }

        .markdown-content pre {
            background-color: #f1f5f9;
            padding: 1em;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1em;
        }

        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
        }

        .markdown-content blockquote {
            border-left: 4px solid #cbd5e1;
            padding-left: 1em;
            color: #64748b;
            margin-bottom: 1em;
        }

        .markdown-content a {
            color: #2563eb;
            text-decoration: underline;
        }

        .markdown-content a:hover {
            color: #1d4ed8;
        }

        /* Brand panel styles */
        .brand-item {
            position: relative;
        }

        .brand-popover {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            z-index: 100;
            min-width: 20rem;
            max-width: 22rem;
            max-height: 60vh;
            overflow-y: auto;
        }

        /* keep brand logo images visible */
        .brand-logo-img {
            opacity: 0;
            transition: opacity 0.3s;
        }

        .brand-logo-img.loaded {
            opacity: 1;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <header class="bg-white border-b sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col gap-3">

            <!-- Top row: title block + controls -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">

                <!-- Yellow title block -->
                <div class="bg-yellow-400 px-4 py-2 rounded-lg inline-block">
                    <h1 class="text-2xl font-black text-black tracking-widest uppercase leading-tight" data-i18n="pageTitle">
                        MARKETING CATALOGUE
                    </h1>
                </div>

                <!-- Search + Upload -->
                <div class="flex flex-col sm:flex-row items-center gap-3 flex-1 max-w-2xl">
                    <div class="relative flex-1 w-full">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" id="searchBox" placeholder="Rechercher une gamme"
                            data-i18n-placeholder="searchPlaceholder"
                            class="block w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg leading-5 bg-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150">
                    </div>
                    <div class="w-full sm:w-auto flex flex-col sm:flex-row gap-2">
                        <input type="file" id="fileInput" accept=".mktcat,.json" class="hidden">
                        <button onclick="document.getElementById('fileInput').click()"
                            class="w-full whitespace-nowrap px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors flex items-center justify-center gap-2">
                            <i class="fas fa-file-import"></i> <span data-i18n="loadJsonBtn">Intégration fichier JSON</span>
                        </button>
                        <button onclick="openApiModal()"
                            class="w-full whitespace-nowrap px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-medium transition-colors flex items-center justify-center gap-2">
                            <i class="fas fa-cloud-download-alt"></i> <span data-i18n="fetchFromApiBtn">Charger via API</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Brand panel (hidden until data is loaded) -->
            <div id="brandPanel" class="hidden border-t pt-3">
                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2" data-i18n="selectBrandHeading">
                    Sélectionner une Marque
                </p>
                <div id="brandList" class="flex flex-wrap gap-2"></div>
            </div>

        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Result Grid -->
        <div id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div id="loadingState" class="col-span-full text-center py-20">
                <i class="fas fa-spinner fa-spin text-4xl text-blue-600 mb-4"></i>
                <p class="text-slate-500 text-lg" data-i18n="loadingText">Chargement des données...</p>
            </div>
        </div>

        <!-- No results message -->
        <div id="noResults" class="hidden text-center py-20">
            <i class="fas fa-search-minus text-5xl text-slate-300 mb-4"></i>
            <p class="text-slate-500 text-lg" data-i18n="noResults">Aucun résultat ne correspond à votre recherche.</p>
        </div>

        <!-- Error message -->
        <div id="errorState" class="hidden col-span-full text-center py-20">
            <i class="fas fa-exclamation-circle text-5xl text-red-500 mb-4"></i>
            <p class="text-slate-800 font-bold text-xl" data-i18n="errorTitle">Erreur de chargement</p>
            <p id="errorDetails" class="text-slate-500 mt-2"></p>
        </div>
    </main>

    <!-- Detail Modal -->
    <div id="detailModal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="flex items-center justify-center min-h-screen">
            <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full relative overflow-hidden flex flex-col max-h-[90vh]">
                <!-- Modal Header -->
                <div class="p-4 border-b flex justify-between items-center bg-white sticky top-0 z-10">
                    <div>
                        <div id="modalBrand" class="mb-1"></div>
                        <h2 id="modalTitle" class="text-2xl font-bold"></h2>
                    </div>
                    <button onclick="closeModal()"
                        class="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-500 hover:text-slate-800">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>

                <!-- Modal Body -->
                <div class="p-6 overflow-y-auto">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <div class="carousel-container group">
                                <div id="carouselTrack" class="carousel-track"></div>
                                <button onclick="moveCarousel(-1)"
                                    class="absolute left-2 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white p-2 rounded-full shadow-md transition-all opacity-0 group-hover:opacity-100">
                                    <i class="fas fa-chevron-left"></i>
                                </button>
                                <button onclick="moveCarousel(1)"
                                    class="absolute right-2 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white p-2 rounded-full shadow-md transition-all opacity-0 group-hover:opacity-100">
                                    <i class="fas fa-chevron-right"></i>
                                </button>
                                <div id="carouselDots" class="absolute bottom-4 left-0 right-0 flex justify-center gap-2"></div>
                            </div>
                        </div>

                        <div class="space-y-6">
                            <div>
                                <h3 class="text-lg font-semibold text-slate-800 mb-2" data-i18n="modalUSPLabel">Point fort unique</h3>
                                <div id="modalUSP" class="text-blue-700 italic font-medium text-lg leading-relaxed"></div>
                            </div>
                            <div>
                                <h3 class="text-lg font-semibold text-slate-800 mb-2" data-i18n="modalShortTextLabel">Description courte</h3>
                                <div id="modalShortText" class="text-slate-600 leading-relaxed"></div>
                            </div>
                            <div id="longTextContainer">
                                <h3 class="text-lg font-semibold text-slate-800 mb-2" data-i18n="modalLongTextLabel">Informations détaillées</h3>
                                <div id="modalLongText" class="text-slate-600 leading-relaxed">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Feature 8: Technology section (hidden when no data) -->
                    <div id="technologySection" class="hidden mt-10 pt-8 border-t">
                        <h3 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                            <i class="fas fa-microchip text-blue-500"></i> <span data-i18n="technologyLabel">Technologie</span>
                        </h3>
                        <div id="technologyContainer" class="grid grid-cols-1 gap-4"></div>
                    </div>

                    <div class="mt-10 pt-8 border-t">
                        <h3 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                            <i class="fas fa-award text-yellow-500"></i> <span data-i18n="testResultsLabel">Résultats de tests</span>
                        </h3>
                        <div id="testLabelsContainer" class="grid grid-cols-1 gap-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- API Fetch Modal -->
    <div id="apiModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="flex items-center justify-center min-h-screen">
            <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 relative">

                <button onclick="closeApiModal()"

                    <i class="fas fa-times"></i>
                </button>

                <!-- Title -->
                <h2 class="text-xl font-bold text-slate-800 mb-5 flex items-center gap-2 pr-8">
                    <i class="fas fa-cloud-download-alt text-emerald-600"></i>
                    <span data-i18n="apiModalTitle">Charger les catalogues depuis l'API</span>
                </h2>

                <div class="space-y-4">
                    <!-- Language -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">
                            <span data-i18n="languageLabel">Langue</span> <span class="text-red-500">*</span>
                        </label>
                        <select id="apiLanguageSelect" onchange="updateApiCountryOptions()"
                            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none bg-white">
                        </select>
                    </div>

                    <!-- Country -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">
                            <span data-i18n="countryLabel">Pays</span> <span class="text-red-500">*</span>
                        </label>
                        <select id="apiCountrySelect"
                            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none bg-white">
                        </select>
                    </div>

                    <!-- Tread Design (optional) -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">
                            <span data-i18n="optionalTreadDesign">Design de pneu (optionnel)</span>
                        </label>
                        <input type="text" id="apiTreadDesign"
                            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none"
                            placeholder="">
                    </div>

                    <!-- Brand (optional) -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">
                            <span data-i18n="optionalBrand">Marque (optionnel)</span>
                        </label>
                        <input type="text" id="apiBrandInput"
                            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none"
                            placeholder="">
                    </div>
                </div>

                <!-- Credentials separator -->
                <div class="border-t border-slate-200 mt-5 pt-4 space-y-4">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide -mb-1">Authentication</p>

                    <!-- API Key -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">
                            API Key <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="apiKeyInput"
                            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none font-mono"
                            placeholder="apikey">
                    </div>

                    <!-- Username -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">
                            Username <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="apiUsernameInput"
                            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none"
                            placeholder="username">
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">
                            Password <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <input type="password" id="apiPasswordInput"
                                class="w-full border border-slate-300 rounded-lg px-3 py-2 pr-10 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none font-mono"
                                placeholder="password">
                            <button type="button" onclick="togglePasswordVisibility()"
                                class="absolute inset-y-0 right-2 flex items-center text-slate-400 hover:text-slate-600 transition-colors"
                                tabindex="-1">
                                <i id="passwordEyeIcon" class="fas fa-eye text-sm"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Action buttons -->
                <div class="mt-6 flex gap-3 justify-end">
                    <button onclick="closeApiModal()"
                        class="px-4 py-2 border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-100 transition-colors font-medium text-sm">
                        <span data-i18n="cancelBtnLabel">Annuler</span>
                    </button>
                    <button onclick="fetchFromApi()"
                        class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-medium transition-colors text-sm flex items-center gap-2">
                        <i class="fas fa-cloud-download-alt"></i>
                        <span data-i18n="fetchBtnLabel">Charger</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

        /** Return the translated string for key, falling back to French then the key itself. */
        function t(key) {
            return (i18n[activeLanguage] && i18n[activeLanguage][key]) || i18n.fr[key] || key;
        }

        /** Detect the UI language from the loaded JSON or the URL query-string. */
        function detectLanguage(data) {
            // 0. API language override (set by fetchFromApi before calling loadData)
            if (pendingApiLanguage !== null) {
                const lang = pendingApiLanguage;
                pendingApiLanguage = null;
                if (i18n[lang]) return lang;
            }
            // 1. URL ?language=XX takes top priority
            const params = new URLSearchParams(window.location.search);
            const qsLang = params.get('language');
            if (qsLang) {
                const norm = qsLang.toLowerCase().split('-')[0];
                if (i18n[norm]) return norm;
            }
            // 2. LanguageCode from the first item in the JSON
            try {
                const rawCode = data.MktCatHeader.Items[0].LanguageDependentData[0].LanguageCode;
                if (rawCode) {
                    const norm = rawCode.toLowerCase().split('-')[0];
                    if (i18n[norm]) return norm;
                }
            } catch (e) { /* fall through */ }
            // 3. Default to French
            return 'fr';
        }

        /** Apply the active language to every data-i18n / data-i18n-placeholder element. */
        function applyTranslations() {
            document.title = t('pageTitle');
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.dataset.i18n);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.placeholder = t(el.dataset.i18nPlaceholder);
            });
        }

        const searchBox = document.getElementById('searchBox');
        const fileInput = document.getElementById('fileInput');
        const resultsGrid = document.getElementById('resultsGrid');
        const noResults = document.getElementById('noResults');
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const errorDetails = document.getElementById('errorDetails');
        const detailModal = document.getElementById('detailModal');

        // ── Utility helpers ────────────────────────────────────────────────────

        function formatMichelinUrl(url, height = 500) {
            if (!url || typeof url !== 'string' || !url.includes('michelin.com')) return url;
            let cleanUrl = url.trim();
            let formattedUrl = cleanUrl.replace('/variation/', '/transform/');
            formattedUrl = formattedUrl.replace('/original', '');
            const separator = formattedUrl.includes('?') ? '&' : '?';
            return `${formattedUrl}${separator}t=resize&height=${height}`;
        }

        function handleImgLoad(img) { img.classList.add('loaded'); }

        function handleImgError(img) {
            img.src = 'https://placehold.co/300x300?text=No+Image';
            img.classList.add('img-error');
        }

        /** Return the formatted logo URL for a brand, or null if unavailable. */
        function getBrandLogoUrl(brandName, height = 80) {
            if (!catalogueData || !catalogueData.MktCatHeader || !catalogueData.MktCatHeader.BrandInfo) return null;
            const key = (brandName || '').toUpperCase();
            const brands = catalogueData.MktCatHeader.BrandInfo.filter(b => b.Brand.toUpperCase() === key);
            const entry = brands.find(b => b.BrandWallPaper && b.BrandWallPaper.length > 0) || brands[0];
            if (!entry || !entry.BrandWallPaper || entry.BrandWallPaper.length === 0) return null;
            return formatMichelinUrl(entry.BrandWallPaper[0].URI, height);
        }

        function renderMarkdown(text) {
            if (!text) return '';
            const rawHtml = marked.parse(text);
            return DOMPurify.sanitize(rawHtml);
        }

        // ── Initialisation ─────────────────────────────────────────────────────

        async function init() {
            searchBox.addEventListener('input', applyFilters);
            fileInput.addEventListener('change', handleFileSelect);
            await fetchData();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            loadingState.classList.remove('hidden');
            errorState.classList.add('hidden');
            resultsGrid.innerHTML = '';
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    loadData(data);
                } catch (err) {
                    showError(t('invalidFileError'));
                }
            };
            reader.onerror = () => showError(t('fileReadError'));
            reader.readAsText(file);
        }

        async function fetchData() {
            try {
                const response = await fetch(JSON_URL);
                if (!response.ok) throw new Error(`Erreur serveur : ${response.status} ${response.statusText}`);
                const data = await response.json();
                loadData(data);
            } catch (error) {
                console.error("Erreur Fetch:", error);
                showError(error.message);
            }
        }

        function showError(message) {
            loadingState.classList.add('hidden');
            errorState.classList.remove('hidden');
            errorDetails.textContent = `Détails : ${message}`;
        }

        // ── Data loading ───────────────────────────────────────────────────────

        function loadData(data) {
            errorState.classList.add('hidden');
            loadingState.classList.add('hidden');
            catalogueData = data;
            items = (catalogueData.MktCatHeader && catalogueData.MktCatHeader.Items)
                ? catalogueData.MktCatHeader.Items : [];

            // Feature 6 – Language detection & translations
            activeLanguage = detectLanguage(data);
            applyTranslations();

            // Feature 2 – Country identification (reset pendingApiCountry side-effect)
            detectCountry(data);

            // Feature 3 – Brand panel
            renderBrandPanel(data);

            applyFilters();
        }

        // ── Feature 2: Country detection ───────────────────────────────────────

        function detectCountry(data) {
            // 1. If loaded from API, use the stored country code directly
            if (pendingApiCountry !== null) {
                const country = pendingApiCountry;
                pendingApiCountry = null;
                return country.toUpperCase();
            }

            // 2. Parse country from LanguageCode (last segment after "-")
            //    e.g. "de-DE" → "DE", "bs-Latn-BA" → "BA", "ar-001" → "001"
            try {
                const langCode = data.MktCatHeader.Items[0].LanguageDependentData[0].LanguageCode;
                if (langCode) {
                    const parts = langCode.split('-');
                    return parts[parts.length - 1].toUpperCase();
                }
            } catch (e) { /* fall through */ }

            return '—';
        }

        // ── Feature 3: Brand panel ─────────────────────────────────────────────

        function renderBrandPanel(data) {
            const brandPanel = document.getElementById('brandPanel');
            const brandList  = document.getElementById('brandList');

            if (!data.MktCatHeader || !data.MktCatHeader.BrandInfo) {
                brandPanel.classList.add('hidden');
                return;
            }

            // Deduplicate brands by normalised (uppercase) name,
            // preferring entries that have wallpaper / USP / long text.
            const brandMap = new Map();
            data.MktCatHeader.BrandInfo.forEach(b => {
                const key = b.Brand.toUpperCase();
                if (!brandMap.has(key)) {
                    brandMap.set(key, b);
                } else {
                    const existing = brandMap.get(key);
                    const existingHasData = existing.BrandWallPaper || existing.BrandUSP || existing.BrandLongText;
                    const newHasData = b.BrandWallPaper || b.BrandUSP || b.BrandLongText;
                    if (!existingHasData && newHasData) brandMap.set(key, b);
                }
            });

            hiddenBrands.clear();
            brandList.innerHTML = '';

            brandMap.forEach((brand, brandKey) => {
                const logoUri = (brand.BrandWallPaper && brand.BrandWallPaper.length > 0)
                    ? formatMichelinUrl(brand.BrandWallPaper[0].URI, 80)
                    : null;

                const item = document.createElement('div');
                item.className = 'brand-item flex items-center gap-2 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg px-3 py-2 transition-colors cursor-default';
                item.dataset.brandKey = brandKey;

                // Checkbox
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = true;
                checkbox.className = 'w-4 h-4 cursor-pointer accent-yellow-500 flex-shrink-0';
                checkbox.addEventListener('change', () => toggleBrand(brandKey, checkbox.checked));
                item.appendChild(checkbox);

                // Logo or brand name as fallback
                if (logoUri) {
                    const img = document.createElement('img');
                    img.src = logoUri;
                    img.alt = brand.Brand;
                    img.className = 'brand-logo-img h-7 w-auto object-contain flex-shrink-0';
                    img.onload  = () => img.classList.add('loaded');
                    img.onerror = () => { img.style.display = 'none'; };
                    item.appendChild(img);
                }

                // Brand name label
                const nameSpan = document.createElement('span');
                nameSpan.className = 'text-xs font-bold uppercase text-slate-700 whitespace-nowrap';
                nameSpan.textContent = brand.Brand.toUpperCase();
                item.appendChild(nameSpan);

                // "Détails" button (only when there is content to show)
                if (brand.BrandUSP || brand.BrandLongText) {
                    const btn = document.createElement('button');
                    btn.className = 'ml-1 text-xs text-blue-600 hover:text-blue-800 font-medium border border-blue-200 rounded px-2 py-0.5 hover:bg-blue-50 transition-colors whitespace-nowrap flex-shrink-0';
                    btn.textContent = t('brandDetailsBtn');
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleBrandPopover(item, brand);
                    });
                    item.appendChild(btn);
                }

                brandList.appendChild(item);
            });

            brandPanel.classList.remove('hidden');
        }

        function toggleBrand(brandKey, isChecked) {
            if (isChecked) {
                hiddenBrands.delete(brandKey);
            } else {
                hiddenBrands.add(brandKey);
            }
            applyFilters();
        }

        function toggleBrandPopover(parentItem, brand) {
            // If this item already has an open popover, close it and return
            const existing = parentItem.querySelector('.brand-popover');
            if (existing) {
                existing.remove();
                activeBrandPopover = null;
                return;
            }

            // Close any other open popover
            if (activeBrandPopover) {
                const prev = activeBrandPopover.querySelector('.brand-popover');
                if (prev) prev.remove();
                activeBrandPopover = null;
            }

            // Build popover
            const popover = document.createElement('div');
            popover.className = 'brand-popover bg-white border border-slate-200 shadow-2xl rounded-xl p-4';

            // Logo
            const logoUri = (brand.BrandWallPaper && brand.BrandWallPaper.length > 0)
                ? formatMichelinUrl(brand.BrandWallPaper[0].URI, 150)
                : null;
            if (logoUri) {
                const img = document.createElement('img');
                img.src = logoUri;
                img.alt = brand.Brand;
                img.className = 'brand-logo-img h-12 w-auto object-contain mb-3';
                img.onload  = () => img.classList.add('loaded');
                img.onerror = () => { img.style.display = 'none'; };
                popover.appendChild(img);
            }

            // USP
            if (brand.BrandUSP) {
                const usp = document.createElement('p');
                usp.className = 'text-blue-700 italic font-semibold text-sm mb-3 leading-snug';
                usp.textContent = brand.BrandUSP;
                popover.appendChild(usp);
            }

            // Long text (Markdown)
            if (brand.BrandLongText) {
                const longDiv = document.createElement('div');
                longDiv.className = 'markdown-content text-slate-600 text-sm';
                longDiv.innerHTML = renderMarkdown(brand.BrandLongText);
                popover.appendChild(longDiv);
            }

            parentItem.appendChild(popover);
            activeBrandPopover = parentItem;
        }

        // ── Filtering ──────────────────────────────────────────────────────────

        function applyFilters() {
            if (!items.length) return;
            const query = searchBox.value.toLowerCase().trim();
            const filtered = items.filter(item => {
                // Brand checkbox filter
                const brandKey = item.Brand ? item.Brand.toUpperCase() : '';
                if (hiddenBrands.has(brandKey)) return false;

                // Text search filter (gamme / TreadDesign1 only — brand filtering is via checkboxes)
                if (query) {
                    const matchesTread = item.TreadDesign1 && item.TreadDesign1.toLowerCase().includes(query);
                    if (!matchesTread) return false;
                }
                return true;
            });
            renderList(filtered);
        }

        // ── Rendering ──────────────────────────────────────────────────────────

        function renderList(data) {
            resultsGrid.innerHTML = '';
            if (data.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }
            noResults.classList.add('hidden');

            data.forEach((item) => {
                const langData = item.LanguageDependentData.find(d => d.LanguageCode === activeLanguage)
                    || item.LanguageDependentData.find(d => d.LanguageCode === 'fr')
                    || item.LanguageDependentData[0] || {};
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-sm hover:shadow-md border border-slate-200 overflow-hidden cursor-pointer transition-all duration-200 transform hover:-translate-y-1";
                card.onclick = () => showDetail(item);

                const rawImg = item.Image && item.Image.length > 0 ? item.Image[0].URI : null;
                const mainImg = rawImg ? formatMichelinUrl(rawImg, 300) : 'https://placehold.co/300x300?text=No+Image';

                const brandLogoUrl = getBrandLogoUrl(item.Brand, 80);
                const brandHtml = brandLogoUrl
                    ? `<img src="${brandLogoUrl}" alt="${item.Brand || ''}" class="h-8 w-auto object-contain brand-logo-img" onload="handleImgLoad(this)">`
                    : `<span class="text-xs font-bold px-2 py-0.5 bg-blue-100 text-blue-700 rounded-full uppercase">${item.Brand || 'Marque'}</span>`;

                card.innerHTML = `
                    <div class="h-48 bg-slate-100 flex items-center justify-center p-4">
                        <img src="${mainImg}"
                             alt="${item.TreadDesign1}"
                             loading="lazy"
                             onload="handleImgLoad(this)"
                             onerror="handleImgError(this)"
                             class="max-h-full max-w-full object-contain">
                    </div>
                    <div class="p-5">
                        <div class="flex items-center gap-2 mb-1">
                            ${brandHtml}
                        </div>
                        <h3 class="text-xl font-bold text-slate-800">${item.TreadDesign1 || 'Modèle inconnu'}</h3>
                        <div class="markdown-content text-slate-500 text-sm mt-2 line-clamp-3"></div>
                        <div class="mt-4 flex items-center text-blue-600 font-semibold text-sm">
                            ${t('seeDetails')} <i class="fas fa-arrow-right ml-2 text-xs"></i>
                        </div>
                    </div>
                `;

                const shortTextDiv = card.querySelector('.markdown-content');
                if (shortTextDiv) shortTextDiv.innerHTML = renderMarkdown(langData.ShortText || '');

                resultsGrid.appendChild(card);
            });
        }

        // ── Detail modal ───────────────────────────────────────────────────────

        function showDetail(item) {
            const langData = item.LanguageDependentData.find(d => d.LanguageCode === activeLanguage)
                || item.LanguageDependentData.find(d => d.LanguageCode === 'fr')
                || item.LanguageDependentData[0] || {};

            document.getElementById('modalTitle').textContent = item.TreadDesign1 || 'Modèle';

            const brandEl = document.getElementById('modalBrand');
            const modalBrandLogo = getBrandLogoUrl(item.Brand, 120);
            if (modalBrandLogo) {
                brandEl.innerHTML = `<img src="${modalBrandLogo}" alt="${item.Brand || ''}" class="h-10 w-auto object-contain brand-logo-img" onload="handleImgLoad(this)">`;
            } else {
                brandEl.innerHTML = `<span class="text-sm font-bold uppercase tracking-widest text-blue-600">${item.Brand || 'Marque'}</span>`;
            }

            const uspDiv = document.getElementById('modalUSP');
            uspDiv.innerHTML = renderMarkdown(langData.UniqueSellingPoint || 'N/A');
            uspDiv.classList.add('markdown-content');

            const shortTextDiv = document.getElementById('modalShortText');
            shortTextDiv.innerHTML = renderMarkdown(langData.ShortText || '');
            shortTextDiv.classList.add('markdown-content');

            const longText = langData.LongText;
            const longTextDiv = document.getElementById('modalLongText');
            if (longText) {
                longTextDiv.innerHTML = renderMarkdown(longText);
                longTextDiv.classList.add('markdown-content');
                document.getElementById('longTextContainer').classList.remove('hidden');
            } else {
                document.getElementById('longTextContainer').classList.add('hidden');
            }

            const track = document.getElementById('carouselTrack');
            const dots  = document.getElementById('carouselDots');
            track.innerHTML = '';
            dots.innerHTML  = '';
            currentCarouselIndex = 0;
            currentImagesCount = item.Image ? item.Image.length : 0;

            if (currentImagesCount > 0) {
                item.Image.forEach((img, i) => {
                    const formattedUri = formatMichelinUrl(img.URI, 600);
                    const slide = document.createElement('div');
                    slide.className = 'carousel-item';
                    slide.innerHTML = `<img src="${formattedUri}" alt="Image ${i}" onload="handleImgLoad(this)" onerror="handleImgError(this)">`;
                    track.appendChild(slide);

                    const dot = document.createElement('button');
                    dot.className = `w-2 h-2 rounded-full transition-all ${i === 0 ? 'bg-blue-600 w-4' : 'bg-slate-300'}`;
                    dot.onclick = () => goToSlide(i);
                    dots.appendChild(dot);
                });
            } else {
                track.innerHTML = `<div class="carousel-item"><img src="https://placehold.co/600x400?text=No+Image" class="loaded"></div>`;
            }

            updateCarouselPosition();

            // ── Feature 8: Technology section ───────────────────────────────
            const techSection   = document.getElementById('technologySection');
            const techContainer = document.getElementById('technologyContainer');
            techContainer.innerHTML = '';
            const techLabels = langData.TechnologyLabel || [];
            if (techLabels.length > 0) {
                const sorted = [...techLabels].sort((a, b) => {
                    const aO = a.SortOrder != null ? parseInt(a.SortOrder, 10) : 9999;
                    const bO = b.SortOrder != null ? parseInt(b.SortOrder, 10) : 9999;
                    return aO - bO;
                });
                sorted.forEach(tech => {
                    const card = document.createElement('div');
                    card.className = 'bg-slate-50 border border-slate-200 rounded-lg p-4 flex flex-row gap-4 items-start';
                    if (tech.URI) {
                        const img = document.createElement('img');
                        img.src     = formatMichelinUrl(tech.URI, 80);
                        img.alt     = tech.Description || t('technologyLabel');
                        img.className = 'w-16 h-16 object-contain flex-shrink-0 rounded';
                        img.onload  = () => handleImgLoad(img);
                        img.onerror = () => { img.style.display = 'none'; };
                        card.appendChild(img);
                    }
                    const content = document.createElement('div');
                    content.className = 'flex-1 min-w-0';
                    if (tech.Description) {
                        const title = document.createElement('h4');
                        title.className = 'font-bold text-slate-800 text-base mb-1 markdown-content';
                        title.innerHTML = renderMarkdown(tech.Description);
                        content.appendChild(title);
                    }
                    if (tech.FootNotes) {
                        const notes = document.createElement('div');
                        notes.className = 'markdown-content text-slate-600 text-sm';
                        notes.innerHTML = renderMarkdown(tech.FootNotes);
                        content.appendChild(notes);
                    }
                    card.appendChild(content);
                    techContainer.appendChild(card);
                });
                techSection.classList.remove('hidden');
            } else {
                techSection.classList.add('hidden');
            }

            // ── Feature 7: Test results with award images ────────────────────
            const testsContainer = document.getElementById('testLabelsContainer');
            testsContainer.innerHTML = '';
            if (langData.TestLabels && langData.TestLabels.length > 0) {
                langData.TestLabels.forEach(test => {
                    const date = test.DateIssue
                        ? new Date(test.DateIssue).toLocaleDateString(activeLanguage, { year: 'numeric', month: 'long', day: 'numeric' })
                        : t('unknownDate');

                    // Layout: [left: metadata + result badge]  [right: award image]
                    const testCard = document.createElement('div');
                    testCard.className = 'bg-slate-50 border border-slate-200 rounded-lg p-4 flex flex-row items-center gap-4';

                    // Left: metadata + result badge
                    const meta = document.createElement('div');
                    meta.className = 'flex-1 min-w-0';
                    meta.innerHTML = `
                        <div class="flex items-center gap-2 mb-1">
                            <span class="bg-yellow-100 text-yellow-800 text-[10px] font-black px-2 py-0.5 rounded uppercase">${t('testOfficielLabel')}</span>
                            <span class="text-xs text-slate-400 font-medium">${date}</span>
                        </div>
                        <h4 class="font-bold text-slate-800 text-lg">${test.NameTestingInstance}</h4>
                        <div class="markdown-content text-slate-500 italic text-sm mt-1 mb-3"></div>
                        <span class="bg-green-600 text-white px-3 py-1.5 rounded-full font-bold text-sm shadow-sm inline-flex items-center gap-1 whitespace-nowrap">
                            <i class="fas fa-check-circle"></i> ${test.TestResult}
                        </span>
                    `;
                    const quotationDiv = meta.querySelector('.markdown-content');
                    if (quotationDiv && test.TestResultQuotation) {
                        quotationDiv.innerHTML = '\u201c' + renderMarkdown(test.TestResultQuotation) + '\u201d';
                    }
                    testCard.appendChild(meta);

                    // Right: award image — only when URI is present
                    if (test.URI) {
                        const awardImg = document.createElement('img');
                        awardImg.src       = formatMichelinUrl(test.URI, 120);
                        awardImg.alt       = test.NameTestingInstance;
                        awardImg.className = 'w-[120px] h-[120px] object-contain flex-shrink-0';
                        awardImg.onload    = () => handleImgLoad(awardImg);
                        awardImg.onerror   = () => { awardImg.style.display = 'none'; };
                        testCard.appendChild(awardImg);
                    }

                    testsContainer.appendChild(testCard);
                });
            } else {
                testsContainer.innerHTML = `<p class="text-slate-400 italic">${t('noTestLabel')}</p>`;
            }

            detailModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            detailModal.classList.add('hidden');
            document.body.style.overflow = '';
        }

        function moveCarousel(dir) {
            if (currentImagesCount === 0) return;
            currentCarouselIndex = (currentCarouselIndex + dir + currentImagesCount) % currentImagesCount;
            updateCarouselPosition();
        }

        function goToSlide(index) {
            currentCarouselIndex = index;
            updateCarouselPosition();
        }

        function updateCarouselPosition() {
            const track = document.getElementById('carouselTrack');
            if (track) track.style.transform = `translateX(-${currentCarouselIndex * 100}%)`;
            const dots = document.getElementById('carouselDots').children;
            Array.from(dots).forEach((dot, i) => {
                if (i === currentCarouselIndex) {
                    dot.classList.add('bg-blue-600', 'w-4');
                    dot.classList.remove('bg-slate-300');
                } else {
                    dot.classList.remove('bg-blue-600', 'w-4');
                    dot.classList.add('bg-slate-300');
                }
            });
        }

        // ── API Modal ──────────────────────────────────────────────────────────

        function openApiModal() {
            populateApiLanguages();
            if (lastApiModalState) {
                // Restore last used selections
                const langSelect = document.getElementById('apiLanguageSelect');
                if (langSelect) {
                    langSelect.value = lastApiModalState.language;
                    updateApiCountryOptions();
                    const countrySelect = document.getElementById('apiCountrySelect');
                    if (countrySelect) countrySelect.value = lastApiModalState.country;
                }
                document.getElementById('apiTreadDesign').value  = lastApiModalState.treadDesign;
                document.getElementById('apiBrandInput').value   = lastApiModalState.brand;
                document.getElementById('apiKeyInput').value     = lastApiModalState.apiKey;
                document.getElementById('apiUsernameInput').value = lastApiModalState.username;
                document.getElementById('apiPasswordInput').value = lastApiModalState.password;
            } else {
                document.getElementById('apiTreadDesign').value  = '';
                document.getElementById('apiBrandInput').value   = '';
                document.getElementById('apiKeyInput').value     = '';
                document.getElementById('apiUsernameInput').value = '';
                document.getElementById('apiPasswordInput').value = '';
            }
            document.getElementById('apiModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeApiModal() {
            // Persist current selections so re-opening restores them
            const langSelect    = document.getElementById('apiLanguageSelect');
            const countrySelect = document.getElementById('apiCountrySelect');
            if (langSelect && countrySelect) {
                lastApiModalState = {
                    language:    langSelect.value,
                    country:     countrySelect.value,
                    treadDesign: document.getElementById('apiTreadDesign').value,
                    brand:       document.getElementById('apiBrandInput').value,
                    apiKey:      document.getElementById('apiKeyInput').value,
                    username:    document.getElementById('apiUsernameInput').value,
                    password:    document.getElementById('apiPasswordInput').value
                };
            }
            document.getElementById('apiModal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function togglePasswordVisibility() {
            const input = document.getElementById('apiPasswordInput');
            const icon  = document.getElementById('passwordEyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        /** Populate the language <select> with unique languages sorted by English name. */
        function populateApiLanguages() {
            const langSelect = document.getElementById('apiLanguageSelect');
            if (!langSelect) return;

            const seen = new Set();
            const langs = [];
            LOCALE_COMBINATIONS.forEach(lc => {
                if (!seen.has(lc.language)) {
                    seen.add(lc.language);
                    langs.push({ language: lc.language, languageEN: lc.languageEN });
                }
            });
            langs.sort((a, b) => a.languageEN.localeCompare(b.languageEN));

            langSelect.innerHTML = '';
            langs.forEach(l => {
                const opt = document.createElement('option');
                opt.value = l.language;
                opt.textContent = `${l.languageEN} (${l.language})`;
                langSelect.appendChild(opt);
            });

            updateApiCountryOptions();
        }

        /** Refresh the country <select> to only show countries valid for the selected language. */
        function updateApiCountryOptions() {
            const langSelect    = document.getElementById('apiLanguageSelect');
            const countrySelect = document.getElementById('apiCountrySelect');
            if (!langSelect || !countrySelect) return;

            const selectedLang = langSelect.value;
            const countries = LOCALE_COMBINATIONS
                .filter(lc => lc.language === selectedLang)
                .sort((a, b) => a.countryEN.localeCompare(b.countryEN));

            countrySelect.innerHTML = '';
            countries.forEach(lc => {
                const opt = document.createElement('option');
                opt.value = lc.country;
                opt.textContent = `${lc.countryEN} (${lc.country})`;
                countrySelect.appendChild(opt);
            });
        }

        /** Fetch catalogues from the remote API using the selected parameters. */
        async function fetchFromApi() {
            const lang        = document.getElementById('apiLanguageSelect').value;
            const country     = document.getElementById('apiCountrySelect').value;
            const treadDesign = document.getElementById('apiTreadDesign').value.trim().replaceAll(" ", "_");
            const brand       = document.getElementById('apiBrandInput').value.trim();
            const apiKey      = document.getElementById('apiKeyInput').value.trim();
            const username    = document.getElementById('apiUsernameInput').value.trim();
            const password    = document.getElementById('apiPasswordInput').value;

            if (!lang || !country || !apiKey || !username || !password) return;

            closeApiModal();

            resultsGrid.innerHTML = '';
            loadingState.classList.remove('hidden');
            errorState.classList.add('hidden');
            document.getElementById('brandPanel').classList.add('hidden');

            let url = `${API_URL}?language=${encodeURIComponent(lang)}&country=${encodeURIComponent(country)}`;
            if (treadDesign) url += `&treadDesign=${encodeURIComponent(treadDesign)}`;
            if (brand)       url += `&brand=${encodeURIComponent(brand)}`;

            const headers = {
                'apikey':        apiKey,
                'Authorization': 'Basic ' + btoa(`${username}:${password}`)
            };

            try {
                const response = await fetch(url, { headers });
                if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
                const data = await response.json();
                // Store language & country so detectLanguage/detectCountry can use them
                pendingApiLanguage = lang;
                pendingApiCountry  = country;
                loadData(data);
            } catch (err) {
                showError(err.message);
            }
        }

        // ── Global event listeners ─────────────────────────────────────────────

        detailModal.addEventListener('click', (e) => {
            if (e.target === detailModal) closeModal();
        });

        document.getElementById('apiModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('apiModal')) closeApiModal();
        });

        // Close brand popover when clicking outside
        document.addEventListener('click', (e) => {
            if (!activeBrandPopover) return;
            if (!activeBrandPopover.contains(e.target)) {
                const popover = activeBrandPopover.querySelector('.brand-popover');
                if (popover) popover.remove();
                activeBrandPopover = null;
            }
        });

        window.onload = init;
    </script>
</body>

</html>
